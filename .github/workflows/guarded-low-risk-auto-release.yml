name: Guarded low-risk automatic release
"on":
  workflow_dispatch:
    inputs:
      preview_url: { required: true, type: string }
      deployment_id: { required: true, type: string }
      rollback_deployment_id: { required: true, type: string }
      desktop_confirmed: { required: true, type: boolean, default: false }
      severity: { required: true, type: string }
      agent_safe_label: { required: true, type: boolean, default: false }
permissions:
  contents: read
  actions: write
jobs:
  gate:
    if: ${{ vars.MAMORU_AGENT_AUTO_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/feature/guarded-low-risk-auto-release' }}
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --test agent/low-risk-policy.test.js agent/index.test.js agent/workflow.test.js
      - run: npm test
      - run: node --check agent/low-risk-policy.js && node --check agent/rollback-dry-run.js
      - run: git diff --check
      - run: npx wrangler deploy --dry-run --outdir=dist-agent-auto-release
      - name: Preview and unauthenticated admin smoke test
        env: { PREVIEW_URL: ${{ inputs.preview_url }} }
        run: node agent/smoke-check.js
      - run: node agent/rollback-dry-run.js "${{ inputs.rollback_deployment_id }}"
      - id: policy
        env: { DESKTOP_CONFIRMED: ${{ inputs.desktop_confirmed }}, SEVERITY: ${{ inputs.severity }}, AGENT_SAFE: ${{ inputs.agent_safe_label }} }
        run: |
          test "$DESKTOP_CONFIRMED" = true
          test "$AGENT_SAFE" = true
          test "$SEVERITY" = minor -o "$SEVERITY" = accessibility
          echo 'allowed=true' >> "$GITHUB_OUTPUT"
  release:
    needs: gate
    if: ${{ needs.gate.outputs.allowed == 'true' && vars.MAMORU_AGENT_AUTO_RELEASE_ENABLED == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "AUTO_RELEASE_ALLOWED; deployment=${{ inputs.deployment_id }}"
      - name: Deploy low-risk release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Kill switch on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh variable set MAMORU_AGENT_AUTO_RELEASE_ENABLED --body false --repo "${{ github.repository }}"
